name: Refresh terminal profile

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/generate_profile.py'
      - 'tests/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: read

concurrency:
  group: terminal-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify profile statistics
        run: python3 -m unittest discover -s tests -v
      - name: Fetch public GitHub data and render terminal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_profile.py --username vanhhoang
      - name: Commit refreshed profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/header.svg assets/streak.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh GitHub profile data'
          git push
