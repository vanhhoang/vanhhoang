<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="228" viewBox="0 0 1040 228" role="img" aria-labelledby="title desc">
<title id="title">GitHub activity / contribution streaks</title>
<desc id="desc">Contribution statistics for the year displayed on the GitHub calendar, as of 2026-10-28 07:50 UTC. Current streak includes yesterday while today is in progress.</desc>
<style>
  text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:17px;fill:#c9d1d9;}
  .bright{fill:#f0f3f6;} .dim{fill:#9da7b3;} .accent{fill:#d9b36c;}
  .small{font-size:13px;} .tiny{font-size:12px;}
  .streak-ring{animation:ring-in 1.1s ease-out both;}
  .streak-flame{animation:flame-glow 3s ease-in-out infinite;}
  @keyframes ring-in{from{stroke-dasharray:0 264;}to{stroke-dasharray:244 20;}}
  @keyframes flame-glow{0%,100%{opacity:1;}50%{opacity:.7;}}
  @media(prefers-reduced-motion:reduce){.streak-ring,.streak-flame{animation:none!important;}}
</style>
<rect x="1" y="1" width="1038" height="226" rx="5" fill="#8c959f0a" stroke="#8c959f66"/>
<text x="24" y="23" class="dim tiny">GITHUB ACTIVITY / PAST YEAR</text>
<text x="1016" y="23" text-anchor="end" class="dim tiny">UTC</text>
<g transform="translate(24 36)"><g role="group" aria-label="Contribution streaks for the displayed year"><path d="M326 17V157M666 17V157" stroke="#8c959f55"/><text x="164" y="75" text-anchor="middle" class="bright" style="font-size:31px;font-weight:700">1,629</text><text x="164" y="113" text-anchor="middle" class="small">Year Contributions</text><text x="164" y="139" text-anchor="middle" class="dim tiny">29 Oct 2025 - 28 Oct 2026</text><circle cx="496" cy="66" r="42" fill="none" stroke="#8c959f33" stroke-width="4"/><circle class="streak-ring" cx="496" cy="66" r="42" fill="none" stroke="#d9b36c" stroke-width="4" stroke-linecap="round" stroke-dasharray="244 20" transform="rotate(-76 496 66)"/><path class="streak-flame" transform="translate(484 8)" d="M12 0C15 8 21 9 21 17C21 23 16 27 11 27C5 27 1 23 1 18C1 14 3 11 6 8C6 13 8 15 10 13C13 10 11 5 12 0Z" fill="#d9b36c"/><text x="496" y="77" text-anchor="middle" class="accent" style="font-size:31px;font-weight:700">1</text><text x="496" y="130" text-anchor="middle" class="accent small">Current Streak</text><text x="496" y="153" text-anchor="middle" class="dim tiny">28 Oct 2026</text><text x="828" y="75" text-anchor="middle" class="bright" style="font-size:31px;font-weight:700">9</text><text x="828" y="113" text-anchor="middle" class="small">Longest Streak</text><text x="828" y="139" text-anchor="middle" class="dim tiny">24 Sep 2026 - 02 Oct 2026</text></g></g>
</svg>